# relay mailbox behind Tailscale: reachable only from your tailnet, over HTTPS
# (https://<TS_HOSTNAME>.<tailnet>.ts.net), never from the LAN or the internet.
#
#   1. Tailscale admin console: enable MagicDNS + HTTPS certificates; create an auth key
#      (tagged, e.g. tag:relay-mailbox) and put it in .env as TS_AUTHKEY (keep it out of git).
#      ACL: allow only your own devices to tag:relay-mailbox:443 (nothing else, no other ports).
#   2. docker compose up -d
#   3. docker compose exec mailbox python -m relay_mailbox.server add-token laptop   (one per machine)
#   4. On each machine: /relay:sync setup, backend http, url https://relay-mailbox.<tailnet>.ts.net
#
# Pin both images by digest for real deployments.
services:
  tailscale:
    image: tailscale/tailscale:stable
    hostname: relay-mailbox
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      # Kernel networking: tailnet traffic reaches this namespace's own network
      # stack, so only `tailscale serve` (443) is reachable; the mailbox listens
      # on 127.0.0.1 and can't be reached on 8484. (In userspace mode tailscaled
      # forwards tailnet ports to localhost, which would expose 8484 as plain HTTP.)
      TS_USERSPACE: "false"
      TS_EXTRA_ARGS: --advertise-tags=tag:relay-mailbox
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add: [NET_ADMIN]
    volumes:
      - ./tailscale-state:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    restart: unless-stopped

  mailbox:
    build: .
    network_mode: service:tailscale   # listens on the sidecar's localhost only
    depends_on: [tailscale]
    volumes:
      - ./data:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
