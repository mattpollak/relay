[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "relay-mailbox"
version = "0.1.0"
description = "Self-hosted mailbox for relay's optional multi-machine sync (stores opaque encrypted files)"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
relay-mailbox = "relay_mailbox.server:main"

[dependency-groups]
dev = ["pytest>=8.0"]
